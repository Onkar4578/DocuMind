services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: docmind
      POSTGRES_PASSWORD: docmind
      POSTGRES_DB: docmind
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docmind"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://docmind:docmind@postgres:5432/docmind
      QDRANT_LOCAL_PATH: /app/qdrant_storage
      UPLOAD_DIR: /app/uploaded_pdfs
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - qdrant_data:/app/qdrant_storage
      - uploaded_pdfs:/app/uploaded_pdfs
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
  qdrant_data:
  uploaded_pdfs:
